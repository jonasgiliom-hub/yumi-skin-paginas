<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yumi Skin — Linha PDRN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@400;500;600&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--cream:#FDFBFA;--ink:#161214;--ink-soft:#6E5C60;--coral:#EF4E64;--coral-deep:#C82C4E;--pink-soft:#FCE9EC;--pink-mid:#F6CDD5;--line:#F0DEE1;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:900px;margin:0 auto;padding:60px 24px 80px;text-align:center;}
  .mockup-banner{background:#180A0E;color:#F6D3DA;font-size:11px;line-height:1.5;padding:9px 18px;text-align:center;}
  .logo{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:24px;}
  .logo span{color:var(--coral);}
  .eyebrow{font-family:'Jost',sans-serif;font-size:11.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--coral);margin:28px 0 10px;}
  h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:38px;margin:0 0 40px;}
  .grid{display:grid;grid-template-columns:1fr;gap:18px;}
  @media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);}}
  a.card{display:block;border:1px solid var(--line);border-radius:20px;padding:32px 20px;text-decoration:none;color:inherit;background:#fff;transition:border-color .15s;}
  a.card:hover{border-color:var(--coral);}
  .orb{width:80px;height:80px;margin:0 auto 16px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--pink-soft),var(--pink-mid));display:flex;align-items:center;justify-content:center;font-size:26px;}
  .card b{display:block;font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;margin-bottom:6px;}
  .card span{font-size:12.5px;color:var(--ink-soft);}
</style>
</head>
<body>
<div class="mockup-banner">🛠️ Mockup local de trabalho — páginas de produto da linha PDRN, sem preço/fotografia final.</div>
<div class="wrap">
  <div class="logo">yumi<span>skin</span></div>
  <div class="eyebrow">— Linha PDRN —</div>
  <h1>Escolha o passo do seu ritual.</h1>
  <div class="grid">
    <a class="card" href="cleanser.html">
      <div class="orb">🧴</div>
      <b>PDRN Cleanser</b>
      <span>Passo 01 · Cleanse · 120ml</span>
    </a>
    <a class="card" href="serum.html">
      <div class="orb">💧</div>
      <b>PDRN Serum</b>
      <span>Passo 02 · Treat · 30ml</span>
    </a>
    <a class="card" href="stick.html">
      <div class="orb">🖊️</div>
      <b>PDRN Moisture Stick</b>
      <span>Passo 03 · Glow · 6g</span>
    </a>
  </div>
</div>
</body>
</html>
